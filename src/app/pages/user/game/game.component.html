<div class="documents-wrapper">
	<div class="documents-container">
		<div class="documents-list">
			<div class="documents-header">
				<div class="documents-header-left">
					<div
						class="documents-header-left__avatar"
						routerLink="/profile"
					>
						<img [src]="userService.thumb" alt="" />
					</div>
				</div>
				<div class="documents-header__title">Title header</div>
				<div class="burger-wrap">
					<div class="burger"></div>
				</div>
			</div>

			<div class="documents-main pl0">
				<div class="documents-main-content">
					<div class="documents-main-row">
						<div
							#board
							class="cg-board"
							aria-label="Chess board"
						></div>
					</div>

					<div
						class="documents-main-row"
						style="
							display: flex;
							align-items: center;
							gap: 0.75rem;
							flex-wrap: wrap;
						"
					>
						<button type="button" (click)="toggleColor()">
							Switch color (You: {{ myColor }})
						</button>
						<button type="button" (click)="resetFromStart()">
							Reset
						</button>

						<span>Remaining games: {{ filteredGames.length }}</span>
						<span *ngIf="popularNextMoves.length">
							Next suggestion: {{ popularNextMoves[0]?.san }} ({{
							popularNextMoves[0]?.count }})
						</span>
					</div>

					<div
						class="documents-main-row"
						*ngIf="historySan.length"
						style="font-family: monospace"
					>
						Moves: {{ historySan.join(' ') }}
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
