<section class="mx-auto flex w-full max-w-md flex-col gap-6 px-4 pb-8 pt-10 sm:px-6 sm:pt-16">
	<img class="size-16 rounded-2xl" ngSrc="logo.png" width="64" height="64" alt="" priority />

	<div>
		<h1 class="text-2xl font-semibold tracking-tight">{{ 'Sign in' | t }}</h1>
		<p class="mt-1 text-mute">{{ 'Use your Google or Apple account to get your profile.' | t }}</p>
	</div>

	<div class="flex flex-col gap-3">
		<button
			class="ds-btn ds-btn-primary ds-btn-lg w-full"
			type="button"
			[disabled]="pending()"
			[attr.aria-busy]="pending()"
			(click)="signInWithGoogle()"
		>
			<span class="flex size-6 items-center justify-center rounded-full bg-white">
				<svg class="size-4" viewBox="0 0 48 48" aria-hidden="true">
					<path
						fill="#FFC107"
						d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"
					/>
					<path
						fill="#FF3D00"
						d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
					/>
					<path
						fill="#4CAF50"
						d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"
					/>
					<path
						fill="#1976D2"
						d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"
					/>
				</svg>
			</span>
			{{ (pending() ? 'Signing in…' : 'Continue with Google') | t }}
		</button>

		<button
			class="ds-btn ds-btn-lg w-full bg-black! text-white! border-black!"
			type="button"
			[disabled]="pending()"
			[attr.aria-busy]="pending()"
			(click)="signInWithApple()"
		>
			<svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
				<path d="M16.37 1.43c0 1.14-.46 2.22-1.2 3-.8.86-2.1 1.52-3.16 1.43-.13-1.1.42-2.25 1.15-3 .82-.86 2.2-1.5 3.21-1.43zM20.5 17.1c-.55 1.27-.82 1.84-1.52 2.96-.99 1.57-2.38 3.52-4.1 3.54-1.54.02-1.94-1-4.03-.99-2.09.01-2.53 1.01-4.07.99-1.72-.02-3.04-1.78-4.03-3.35C-.1 15.9-.4 10.9 1.3 8.3c1.2-1.85 3.1-2.93 4.88-2.93 1.81 0 2.95 1 4.45 1 1.45 0 2.34-1 4.44-1 1.58 0 3.26.86 4.46 2.35-3.92 2.15-3.28 7.76.97 9.38z"/>
			</svg>
			{{ (pending() ? 'Signing in…' : 'Continue with Apple') | t }}
		</button>

		@if (error(); as message) {
			<p class="rounded-xl border border-danger p-4 text-sm" role="alert">{{ message | t }}</p>
		}
	</div>

	<app-preferences />
</section>
