<footer class="shrink-0 md:border-t md:border-line">
	<div
		class="mx-auto hidden max-w-[72rem] gap-1 px-4 py-2 text-sm text-mute sm:px-6 md:flex md:items-center md:justify-between"
	>
		<p class="font-medium text-fg">{{ company().name }}</p>
		<p>{{ 'Train your candidate move thinking.' | t }} &copy; {{ year }}</p>
	</div>

	<!-- Phones: the main navigation lives here, as a bar below the scrolling content. -->
	<nav
		class="border-t border-line bg-card pb-[env(safe-area-inset-bottom)] md:hidden"
		[attr.aria-label]="'Main' | t"
	>
		<ul class="mx-auto grid max-w-md" [style.grid-template-columns]="'repeat(' + links.length + ', minmax(0, 1fr))'">
			@for (link of links; track link.path) {
				<li>
					<a
						class="group flex h-12 items-center justify-center text-mute! no-underline aria-[current=page]:text-brand!"
						[routerLink]="link.path"
						[attr.aria-current]="nav.isActive(link) ? 'page' : null"
					>
						<span
							class="flex h-8 items-center justify-center gap-2 rounded-full px-4 text-sm font-medium group-aria-[current=page]:bg-soft"
						>
							<app-icon [name]="link.icon" />
							{{ link.label | t }}
						</span>
					</a>
				</li>
			}
		</ul>
	</nav>
</footer>
